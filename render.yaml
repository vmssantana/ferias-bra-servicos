services:
  - type: web
    name: ferias-bra-servicos
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SPREADSHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: BASE_SHEET_NAME
        value: BASE_COLABORADORES
      - key: RESPONSES_SHEET_NAME
        value: RESPOSTAS_FERIAS
      - key: CACHE_MINUTES
        value: "10"
